openapi: 3.1.0
info:
  title: LiuGuang Worker API
  version: 1.0.0
  description: 可选的单用户流光任务节点接口，供网页工具、自动化和其他受信客户端调用。
servers:
  - url: https://worker.example.com
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      summary: 检查节点状态和版本
      security: []
      responses:
        "200":
          description: 节点可访问
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/session/verify:
    post:
      summary: 验证访问令牌和节点配置
      responses:
        "200":
          description: 验证结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/jobs:
    post:
      summary: 提交抖音采集任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "202":
          description: 已进入任务队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    get:
      summary: 获取最近任务
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Job"
  /v1/jobs/{jobId}:
    get:
      summary: 获取任务详情
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 任务详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/jobs/{jobId}/retry:
    post:
      summary: 重试失败任务
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202":
          description: 已重新进入队列
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: 输入无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 访问令牌无效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 任务不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required: [ok, service, version]
      properties:
        ok: { type: boolean }
        service: { type: string }
        version: { type: string }
    VerifyResponse:
      type: object
      required: [ok, feishuConfigured, speechConfigured, analysisConfigured]
      properties:
        ok: { type: boolean }
        feishuConfigured: { type: boolean }
        speechConfigured: { type: boolean }
        analysisConfigured: { type: boolean }
        tableName: { type: string }
    CreateJobRequest:
      type: object
      required: [source]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 5000
        clientRequestId:
          type: string
          format: uuid
    JobResponse:
      type: object
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/Job"
    Job:
      type: object
      required: [id, status, stage, source, createdAt, updatedAt]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [queued, running, retry_wait, succeeded, failed]
        stage:
          type: string
          enum: [queued, metadata, media, transcript, proofread, analysis, archive, completed]
        source: { type: string }
        title: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        feishuRecordId: { type: string }
        errorMessage: { type: string }
        canRetry: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
